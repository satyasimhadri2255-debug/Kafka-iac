AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Self-managed single-node Apache Kafka cluster (KRaft mode, no ZooKeeper, no MSK) on one EC2 instance.

Parameters:
  InstanceType:
    Type: String
    Default: c7i-flex.large
    Description: EC2 instance type for the Kafka node.
  HeapSize:
    Type: String
    Default: 1g
    AllowedPattern: "^[0-9]+[mg]$"
    Description: JVM heap for Kafka (e.g. 1g).
  VolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 10
    Description: Root EBS volume size in GiB; Kafka data lives on this volume.
  KafkaVersion:
    Type: String
    Default: 4.3.1
    Description: Apache Kafka version (Apache CDN, falls back to archive.apache.org).
  ClusterId:
    Type: String
    Default: Wmd2b1dxQ3hTaE9DbzZ6Rw
    AllowedPattern: "^[A-Za-z0-9_-]{22}$"
    Description: >-
      KRaft cluster ID (22-char base64url). Generate a fresh one per cluster with
      `python3 -c "import uuid,base64;print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip('='))"`.
  ClientCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: CIDR allowed to reach the Kafka client port 9092 (defaults to the VPC).
  KafkaAdminUser:
    Type: String
    Default: kafka-admin
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: SASL/SCRAM username for the Kafka admin. The password is generated in Secrets Manager.


Rules:
  RegionIsUsEast2:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-2]
        AssertDescription: This template hardcodes a us-east-2 AMI; deploy it in us-east-2.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  KafkaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Single-node Kafka (broker + KRaft controller)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Kafka clients
          IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: !Ref ClientCidr
      SecurityGroupEgress:
        - Description: Outbound for package and Kafka downloads, SSM
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-kafka

  # SCRAM credentials for the client listener. Secrets Manager generates the password;
  # the instance reads it at boot with its role, so it never appears in user data.
  KafkaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub SASL/SCRAM-SHA-512 admin credentials for the ${AWS::StackName} Kafka broker
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${KafkaAdminUser}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  KafkaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-kafka-admin-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref KafkaAdminSecret

  KafkaInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref KafkaRole

  KafkaInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - PublicSubnetRouteTable
    Properties:
      ImageId: ami-08be4b1b8afa29958
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref KafkaInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref KafkaSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGb
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-kafka
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Installs and starts a single-node Apache Kafka cluster in KRaft mode (broker + controller on one host).
          # Rendered by CloudFormation Fn::Sub; values are injected below.
          set -euxo pipefail

          KAFKA_VERSION="${KafkaVersion}"
          SCALA_VERSION="2.13"
          CLUSTER_ID="${ClusterId}"
          HEAP_SIZE="${HeapSize}"
          SECRET_ARN="${KafkaAdminSecret}"

          KAFKA_DIST="kafka_$SCALA_VERSION-$KAFKA_VERSION"

          # Private IP from instance metadata (IMDSv2); clients in the VPC connect to this address.
          IMDS_TOKEN=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          PRIVATE_IP=$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          REGION=$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/placement/region)

          # Kafka 4.x brokers require Java 17+
          dnf install -y java-21-amazon-corretto-headless shadow-utils tar gzip jq

          id kafka >/dev/null 2>&1 || useradd --system --no-create-home --shell /sbin/nologin kafka

          # dlcdn.apache.org is fast but only hosts current releases; archive.apache.org has every release but is slow.
          curl -fsSL --retry 5 -o "/tmp/$KAFKA_DIST.tgz" "https://dlcdn.apache.org/kafka/$KAFKA_VERSION/$KAFKA_DIST.tgz" \
            || curl -fsSL --retry 5 -o "/tmp/$KAFKA_DIST.tgz" "https://archive.apache.org/dist/kafka/$KAFKA_VERSION/$KAFKA_DIST.tgz"
          tar -xzf "/tmp/$KAFKA_DIST.tgz" -C /opt
          rm -f "/tmp/$KAFKA_DIST.tgz"
          ln -sfn "/opt/$KAFKA_DIST" /opt/kafka

          mkdir -p /etc/kafka /var/lib/kafka/data /var/log/kafka

          # Admin credentials live in Secrets Manager and are read here with the instance role,
          # so they never appear in user data. Tracing is off so the password stays out of
          # /var/log/cloud-init-output.log.
          set +x
          SECRET=$(aws secretsmanager get-secret-value --region "$REGION" --secret-id "$SECRET_ARN" --query SecretString --output text)
          KAFKA_USER=$(jq -r .username <<<"$SECRET")
          KAFKA_PASSWORD=$(jq -r .password <<<"$SECRET")
          JAAS="org.apache.kafka.common.security.scram.ScramLoginModule required username=\"$KAFKA_USER\" password=\"$KAFKA_PASSWORD\";"
          umask 077

          # Single node: every replication factor / ISR setting must be 1.
          # Clients authenticate with SASL/SCRAM-SHA-512; the controller listener stays on localhost.
          cat > /etc/kafka/server.properties <<EOF
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:9093

          listeners=SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
          advertised.listeners=SASL_PLAINTEXT://$PRIVATE_IP:9092
          listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=SASL_PLAINTEXT
          sasl.enabled.mechanisms=SCRAM-SHA-512
          sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
          listener.name.sasl_plaintext.scram-sha-512.sasl.jaas.config=$JAAS

          log.dirs=/var/lib/kafka/data
          num.partitions=3
          default.replication.factor=1
          min.insync.replicas=1
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          auto.create.topics.enable=false
          log.retention.hours=168
          EOF

          # Client settings for the Kafka CLI tools on this host (--command-config).
          cat > /etc/kafka/client.properties <<EOF
          security.protocol=SASL_PLAINTEXT
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=$JAAS
          EOF

          # --add-scram stores the admin's SCRAM credential in the KRaft bootstrap metadata.
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
            --cluster-id "$CLUSTER_ID" \
            --config /etc/kafka/server.properties \
            --add-scram "SCRAM-SHA-512=[name=$KAFKA_USER,password=$KAFKA_PASSWORD]"

          unset SECRET KAFKA_PASSWORD JAAS
          umask 022
          set -x

          chown -R kafka:kafka "/opt/$KAFKA_DIST" /etc/kafka /var/lib/kafka /var/log/kafka

          cat > /etc/systemd/system/kafka.service <<EOF
          [Unit]
          Description=Apache Kafka (KRaft)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=kafka
          Group=kafka
          Environment="KAFKA_HEAP_OPTS=-Xms$HEAP_SIZE -Xmx$HEAP_SIZE"
          Environment="LOG_DIR=/var/log/kafka"
          ExecStart=/opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
          ExecStop=/opt/kafka/bin/kafka-server-stop.sh
          Restart=on-failure
          RestartSec=10
          LimitNOFILE=100000

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now kafka

Outputs:
  BootstrapServers:
    Description: Kafka bootstrap server (reachable from inside the VPC).
    Value: !Sub ${KafkaInstance.PrivateIp}:9092
  InstanceId:
    Description: EC2 instance ID, for `aws ssm start-session --target <id>`.
    Value: !Ref KafkaInstance
  KafkaAdminSecretArn:
    Description: Secrets Manager secret with the SASL/SCRAM admin username and password.
    Value: !Ref KafkaAdminSecret
  VpcId:
    Value: !Ref Vpc
